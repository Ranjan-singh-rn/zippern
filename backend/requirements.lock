# The complete, exact dependency set of the backend image — every package, not only the direct ones.
#
# MFA release, revision 4. `requirements.txt` pins the direct dependencies and the Google stack; their
# transitive dependencies (cryptography, starlette, anyio, certifi, pyasn1, ...) used to be resolved
# again on every build, so two builds of the same source installed different code (24 versions apart
# between the test venv and the 20 Oct production build). This file freezes all 64 packages at the
# versions installed in the reviewed stage 1 image:
#   sha256:73896f7dc996d668f5b662f1ea27c10b9ac2d1c99829121a15c6486a6209cff5 (Cloud Build 79ce1bc9-5b0a-48fd-a06d-45214fe3a62c),
# which differs from production's 20 Oct build only in certifi, pyasn1, msgpack and pycparser.
# The Dockerfile installs this file with --no-deps, so nothing is resolved at build time, then runs `pip check`.
# tests/test_p2_requirements_lock.py keeps it consistent with requirements.txt.
#
# To change a version: change it in requirements.txt (if it is direct) AND here, rebuild, and confirm
# GET /api/health/firestore still answers ok.
