<!-- The wrapper every Zipper email uses. Spec 8A.7.2 / 8A.6.6 — partner-facing
     mail carries the branding and is safe to forward to an accountant. -->
<div style="margin:0;padding:0;background:#f5f5f7">
  <span style="display:none;font-size:1px;color:#f5f5f7;max-height:0;max-width:0;opacity:0;overflow:hidden">{{ preheader }}</span>
  <div style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
              max-width:640px;margin:0 auto;padding:24px 20px;color:#18181b">

    <div style="font-weight:700;font-size:15px;letter-spacing:.5px;margin:0 0 18px">
      ZIPPER
    </div>

    <div style="background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:26px 24px">
      <h1 style="margin:0 0 18px;font-size:20px;line-height:1.3">{{ title }}</h1>
      {{{ body }}}
    </div>

    <p style="color:#71717a;font-size:12px;line-height:1.6;margin:18px 2px 0">
      {{ footer }}
      <br>
      Questions about a figure in this email? Reply to it, or open
      <a href="{{ portal_url }}" style="color:#3f3f46">{{ portal_url }}</a> —
      every number here traces back to the entries that produced it.
    </p>
  </div>
</div>
